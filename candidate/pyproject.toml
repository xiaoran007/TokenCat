[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "tokencat-native"
version = "0.9.0rc1"
description = "TokenCat native CLI candidate: local usage dashboard powered by the shared Rust core."
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "xiaoran" }]
dependencies = ["rich>=14.2.0,<16", "typer>=0.12.0,<0.24"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/xiaoran007/TokenCat"
Repository = "https://github.com/xiaoran007/TokenCat"

[project.scripts]
tokencat-candidate = "tokencat_native.cli:app"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "python"
module-name = "tokencat_native._native"
bindings = "pyo3"
include = [{ path = "tests/**", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
