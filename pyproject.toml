[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "tokencat"
version = "0.9.0"
description = "Local-first, read-only AI coding agent token and usage inspector."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "xiaoran" }
]
keywords = [
  "cli",
  "codex",
  "claude",
  "tokens",
  "usage",
  "developer-tools",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=14.2.0,<16",
  "typer>=0.12.0,<0.24",
]

[project.urls]
Homepage = "https://github.com/xiaoran007/TokenCat"
Repository = "https://github.com/xiaoran007/TokenCat"
Issues = "https://github.com/xiaoran007/TokenCat/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9",
  "maturin>=1.15,<2",
]

[project.scripts]
tokencat = "tokencat.cli:app"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "src"
module-name = "tokencat._native"
bindings = "pyo3"
include = [
  { path = "tests/**", format = "sdist" },
  { path = "ci/**", format = "sdist" },
  { path = "docs/**", format = "sdist" },
  { path = "Makefile", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
