name: CLI release

"on":
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Publish after all checks pass"
        type: choice
        options: [none, testpypi, pypi]
        default: none
        required: true

permissions:
  contents: read

concurrency:
  group: cli-release-${{ inputs.publish_to }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        id: python
        with:
          python-version: "3.14"
      - name: Check project, CLI, binding and lockfile versions
        id: version
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv .venv
          version=$(.venv/bin/python ci/release.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version; commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Check existing tag before a production publish
        if: inputs.publish_to == 'pypi'
        run: .venv/bin/python ci/release.py --tag-commit "$GITHUB_SHA"

  wheels:
    needs: prepare
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm64, runner: macos-14, target: aarch64-apple-darwin, manylinux: "off" }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: "off" }
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: "2014" }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2014" }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Build wheel and source distribution
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --sdist --compatibility pypi --out dist -i python3.14
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tokencat-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.platform.name == 'macos-arm64'
        with:
          name: tokencat-source
          path: dist/*.tar.gz
          if-no-files-found: error

  test-wheels:
    name: Test ${{ matrix.platform.name }} Python ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm64, runner: macos-14 }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: linux-x86_64, runner: ubuntu-24.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
        python: ["3.14"]
        include:
          - { platform: { name: macos-x86_64, runner: macos-15-intel }, python: "3.9" }
          - { platform: { name: linux-x86_64, runner: ubuntu-24.04 }, python: "3.9" }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tokencat-${{ matrix.platform.name }}
          path: dist
      - name: Install built wheel into an isolated virtualenv
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv .venv
          .venv/bin/python -m pip install dist/*.whl 'pytest>=8,<9'
      - name: Test installed CLI
        run: .venv/bin/python -m pytest -q tests

  source-distribution:
    name: Test source distribution
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        id: python
        with:
          python-version: "3.14"
      - name: Check Rust toolchain
        run: rustc --version
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tokencat-source
          path: dist
      - name: Install from source archive and test
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv .venv
          .venv/bin/python -m pip install dist/*.tar.gz 'pytest>=8,<9'
          .venv/bin/python -m pytest -q tests

  native-core:
    needs: prepare
    name: Native core regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked --manifest-path native/Cargo.toml

  release-artifacts:
    name: Validate tested release artifacts
    needs: [prepare, test-wheels, source-distribution, native-core]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        id: python
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: tokencat-*
          merge-multiple: true
          path: dist
      - name: Check exact platform set, versions and package metadata
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv .venv
          .venv/bin/python -m pip install 'twine>=7,<8'
          .venv/bin/python ci/release.py --dist dist
          .venv/bin/python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to ${{ inputs.publish_to }}
    if: inputs.publish_to == 'pypi' || inputs.publish_to == 'testpypi'
    needs: release-artifacts
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.publish_to }}
      url: ${{ inputs.publish_to == 'pypi' && 'https://pypi.org/p/tokencat' || 'https://test.pypi.org/p/tokencat' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Publish the validated distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ inputs.publish_to == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          packages-dir: dist

  github-release:
    name: Create GitHub Release
    if: inputs.publish_to == 'pypi'
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        id: python
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Verify tag and create release from the published distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv .venv
          .venv/bin/python ci/release.py --tag-commit "$GITHUB_SHA"
          release_url=$(gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TokenCat CLI $RELEASE_TAG" \
            --generate-notes)
          echo "GitHub Release: $release_url" >> "$GITHUB_STEP_SUMMARY"
